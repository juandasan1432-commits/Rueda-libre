<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body>
    <main>
        <section class="bg-slate-950 text-slate-100 px-6 py-20">
            <div class="max-w-2xl mx-auto space-y-8">
                <hgroup class="space-y-3">
                    <p class="text-sm font-bold uppercase tracking-widest text-green-600">Nuevo · Jueves a sábado</p>
                    <h1 class="text-5xl font-extrabold">Rueda Nocturna</h1>
                    <p class="text-lg leading-relaxed text-slate-300">Descubre Medellín en bici cuando se encienden las luces</p>
                </hgroup>

                <div class="space-y-6">
                    <ul class="flex gap-6 text-xl font-bold text-slate-100">
                        <li>3 rutas</li>
                        <li>Desde $55.000</li>
                    </ul>
                    <a href="#inscripcion" class="inline-block rounded-lg bg-green-600 px-6 py-3 font-semibold text-slate-950 hover:bg-green-500">Inscríbete</a>
                </div>
            </div>
        </section>

        <section class="bg-slate-950 text-slate-100 px-6 py-20">
            <div class="max-w-2xl  mx-auto space-y-6">
                <h2>Botones</h2>

            <div class="flex flex-wrap gap-4">
                <button type="button" class=" bg-green-600 border-2 border-transparent rounded-xl px-7 py-3 font-semibold text-slate-900 hover:bg-green-500 shadow-lg shadow-green-600/50 focus:outline-none focus:ring-1 focus:ring-slate-100 ring-offset-1"  >       
                    Principal
                </button>

                <button type="button" class="bg-green-600 border-2 border-transparent rounded-xl px-7 py-3 font-semibold text-slate-900 hover:bg-green-500 shadow-lg shadow-green-600/50 focus:outline-none focus:ring-1 focus:ring-slate-100 ring-offset-1">
                    Secundario
                </button>

                <button type="button" class="bg-green-600 border-2 border-transparent rounded-xl px-7 py-3 font-semibold text-slate-900 hover:bg-green-500 shadow-lg shadow-green-600/50 focus:outline-none focus:ring-1 focus:ring-slate-100 ring-offset-1">
                    Tercero
                </button>

            </div>

            
            </div>
        </section>
    </main>
</body>
</html>
